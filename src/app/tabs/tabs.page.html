<ion-tabs [class.score-tab-active]="currentTab === 'tab1'">
  <ion-tab-bar slot="bottom" [style.transform]="(currentTab !== 'tab1' || gameService.showTabBar) ? 'translateY(0)' : 'translateY(100%)'">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="game-controller-outline"></ion-icon>
      <ion-label>Play</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="calculator-outline"></ion-icon>
      <ion-label>Calculator</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="analytics-outline"></ion-icon>
      <ion-label>Stats & History</ion-label>
    </ion-tab-button>

    <!-- Layout Toggle Button (Only visible on Play tab during active game) -->
    <ion-tab-button id="game-layout-toggle" *ngIf="currentTab === 'tab1' && gameService.currentGameState.isActive && gameService.currentGameState.mode !== 3" 
                    (click)="gameService.isUnifiedView = !gameService.isUnifiedView; gameService.toggleTabBar()" 
                    style="--color-selected: var(--player-one-color); color: var(--player-one-color);">
      <ion-icon name="swap-horizontal-outline"></ion-icon>
      <ion-label>{{ gameService.isUnifiedView ? 'Split Screen' : 'Unified View' }}</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

  <!-- Absolute floating close button halfway over the top-right edge of the navbar (positioned outside the tab bar to prevent cropping) -->
  <div *ngIf="currentTab === 'tab1' && gameService.currentGameState.isActive" (click)="gameService.toggleTabBar()" style="position: absolute; bottom: 36px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: rgba(22, 24, 35, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; color: var(--ion-color-danger); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); z-index: 1010; cursor: pointer; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;" [style.transform]="gameService.showTabBar ? 'translateY(0)' : 'translateY(80px)'" [style.opacity]="gameService.showTabBar ? '1' : '0'" [style.pointer-events]="gameService.showTabBar ? 'auto' : 'none'" class="clickable" title="Hide menu">
    <ion-icon name="close-outline" style="font-size: 16px; font-weight: 800;"></ion-icon>
  </div>
</ion-tabs>

<!-- WALKTHROUGH OVERLAY -->
<ng-container *ngIf="onboardingService.isActive && onboardingService.currentStep">
  <!-- Highlight overlay cutout mask -->
  <div class="walkthrough-highlight"
       [style.top.px]="onboardingService.highlightRect.top"
       [style.left.px]="onboardingService.highlightRect.left"
       [style.width.px]="onboardingService.highlightRect.width"
       [style.height.px]="onboardingService.highlightRect.height">
  </div>

  <!-- Tooltip box -->
  <div class="walkthrough-tooltip animate-fade-in"
       [style.top.px]="onboardingService.tooltipTop"
       [style.left.px]="onboardingService.tooltipLeft"
       style="pointer-events: auto;">
    
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
      <h4 style="margin: 0; font-size: 14px; font-weight: 800; color: #fff;">
        {{ onboardingService.currentStep.title }}
      </h4>
      <span style="font-size: 10px; font-weight: 700; color: var(--ion-color-medium); background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 8px; flex-shrink: 0;">
        {{ onboardingService.currentStepIndex + 1 }}/{{ onboardingService.totalSteps }}
      </span>
    </div>

    <!-- Description -->
    <p style="margin: 0 0 16px 0; font-size: 12px; line-height: 1.5; color: rgba(255,255,255,0.8);">
      {{ onboardingService.currentStep.description }}
    </p>

    <!-- Actions -->
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <button (click)="onboardingService.skip()" 
              style="background: transparent; border: none; color: var(--ion-color-medium); font-size: 12px; font-weight: 600; padding: 6px 0; cursor: pointer;">
        Skip
      </button>
      <div style="display: flex; gap: 8px;">
        <button (click)="onboardingService.prev()" 
                [disabled]="onboardingService.currentStepIndex === 0"
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s;"
                [style.opacity]="onboardingService.currentStepIndex === 0 ? '0.4' : '1'">
          Back
        </button>
        <button (click)="onboardingService.next()" 
                style="background: var(--player-one-color); border: none; border-radius: 8px; color: #000; padding: 6px 14px; font-size: 11px; font-weight: 800; cursor: pointer; transition: all 0.2s;">
          {{ onboardingService.currentStepIndex === onboardingService.totalSteps - 1 ? 'Finish' : 'Next' }}
        </button>
      </div>
    </div>
  </div>
</ng-container>
